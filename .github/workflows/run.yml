name: OLD - Telegram MCQ Cluster Engine

on:
  workflow_dispatch:
    inputs:
      disabled:
        description: "Legacy workflow disabled"
        required: false
        default: "true"

jobs:
  legacy-disabled:
    if: ${{ inputs.disabled != 'false' }}
    runs-on: ubuntu-latest

    steps:
      - name: Legacy workflow disabled
        run: |
          echo "Legacy Run.yml is disabled."
          echo "Use the V5 Worker workflow instead."
